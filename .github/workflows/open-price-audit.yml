name: Open retail price audit

on:
  pull_request:
    paths:
      - ".github/workflows/open-price-audit.yml"
      - "tools/audit_open_prices.py"
      - "tests/test_audit_open_prices.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download public WebTruffle and Open Prices data
        run: |
          audit_dir="$RUNNER_TEMP/open-price-audit"
          mkdir -p "$audit_dir"
          cd "$audit_dir"
          fetch() {
            curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
              --max-time 180 --max-filesize "$1" "$2" --output "$3"
          }
          fetch 2000000 https://api.github.com/repos/webtruffle/retail-product-catalog-prices/releases/latest release.json
          tag=$(jq -er '.tag_name | select(test("^[0-9]{4}-[0-9]{2}-[0-9]{2}(-r[0-9]+)?$"))' release.json)
          release="https://github.com/webtruffle/retail-product-catalog-prices/releases/download/$tag"
          fetch 2000000 "$release/manifest.json" manifest.json
          fetch 500000000 "$release/retail-product-prices.csv" retail-product-prices.csv
          fetch 120000000 https://prices.openfoodfacts.org/data/locations.jsonl.gz locations.jsonl.gz
          fetch 120000000 https://prices.openfoodfacts.org/data/prices.jsonl.gz prices.jsonl.gz
      - name: Verify CSV checksum and count regional observations
        run: python tools/audit_open_prices.py "$RUNNER_TEMP/open-price-audit"
      - name: Verify public Hugging Face mirror
        run: |
          cd "$RUNNER_TEMP/open-price-audit"
          fetch() {
            curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
              --max-time 150 --max-filesize "$1" "$2" --output "$3"
          }
          metadata=https://huggingface.co/api/datasets/openfoodfacts/open-prices
          fetch 2000000 "$metadata" dataset.json
          revision=$(jq -er '.sha | select(test("^[0-9a-f]{40}$"))' dataset.json)
          fetch 2000000 "$metadata/tree/$revision" tree.json
          digest=$(jq -er '.[] | select(.path == "prices.parquet") | .lfs.oid | select(test("^[0-9a-f]{64}$"))' tree.json)
          fetch 300000000 "https://huggingface.co/datasets/openfoodfacts/open-prices/resolve/$revision/prices.parquet" prices.parquet
          printf '%s  prices.parquet\n' "$digest" | sha256sum --check
