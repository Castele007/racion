name: Catalog reachability

on:
  pull_request:
    paths:
      - "collectors/**"
      - ".github/workflows/catalog-diagnostics.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check official public catalog endpoints
        run: python -m collectors.diagnose
