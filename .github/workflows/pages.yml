name: Update prices and publish Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "collectors/**"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: racion-pages
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main' && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect authorized prices for Orenburg
        env:
          CATALOG_SOURCES_JSON: ${{ vars.CATALOG_SOURCES_JSON }}
        run: python -m collectors.update
      - name: Store the price snapshot
        run: |
          git add -- site/data/prices.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Update Orenburg price snapshot"
          git push origin HEAD:refs/heads/main

  build:
    needs: refresh
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main'
      && (needs.refresh.result == 'success' || needs.refresh.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    outputs:
      site_revision: ${{ steps.site_revision.outputs.sha }}
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Record the revision being published
        id: site_revision
        run: git rev-parse HEAD | sed 's/^/sha=/' >> "$GITHUB_OUTPUT"
      - uses: actions/configure-pages@v5
      - name: Check public data
        run: |
          node --test tests/planner.test.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the static application
        id: deployment
        uses: actions/deploy-pages@v4


  verify-published:
    needs: [build, deploy]
    if: ${{ !cancelled() && github.event_name == 'push' && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.site_revision }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test runner
        run: |
          npm install --prefix "$RUNNER_TEMP/racion-browser" --no-audit --no-fund playwright@1.62.1
          "$RUNNER_TEMP/racion-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check the published site and decode every recipe image
        env:
          NODE_PATH: ${{ runner.temp }}/racion-browser/node_modules
          RACION_PUBLISHED_URL: ${{ needs.deploy.outputs.page_url }}
        run: test -n "$RACION_PUBLISHED_URL" && node --test tests/browser.test.mjs
